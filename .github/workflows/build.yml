name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ae2Variant: [upstream, uelm]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew clean build --stacktrace -Pae2Variant=${{ matrix.ae2Variant }}

      - name: Verify 1.20.1 artifact boundary
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
          artifact="build/libs/aqe${version}_1.20.1.jar"
          test -f "$artifact"
          jar tf "$artifact" | grep -q '^META-INF/mods.toml$'
          ! jar tf "$artifact" | grep -q '^META-INF/neoforge.mods.toml$'
          ! jar tf "$artifact" | grep -q 'net/neoforged/'
          ! jar tf "$artifact" | grep -q '1.21.1'
          python3 - "$artifact" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as jar:
              classes = [n for n in jar.namelist() if n.endswith('.class')]
              assert classes, 'artifact contains no class files'
              versions = {int.from_bytes(jar.read(n)[6:8], 'big') for n in classes}
              assert versions == {61}, f'unexpected class versions: {versions}'
          PY

      - name: Upload jar
        uses: actions/upload-artifact@v6
        with:
          name: aqe-1.20.1-${{ matrix.ae2Variant }}-${{ github.sha }}
          path: build/libs/aqe*_1.20.1.jar
          if-no-files-found: error
