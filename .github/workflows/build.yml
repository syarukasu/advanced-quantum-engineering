name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ae2Variant: upstream
            ae2File: appliedenergistics2-forge-15.4.10.jar
            ae2Url: https://github.com/AppliedEnergistics/Applied-Energistics-2/releases/download/forge/v15.4.10/appliedenergistics2-forge-15.4.10.jar
            ae2Sha256: fbfee05c6674cb6b00fe425e945ca4818d41eb34069b60dcb4a36221a0390fcc
          - ae2Variant: uelm
            ae2File: appliedenergistics2-forge-15.5.0-uelm.jar
            ae2Url: https://github.com/AE2-Unofficial-Extended-Life-Modern/AE2-UELM/releases/download/forge/v15.5.0-uelm/appliedenergistics2-forge-15.5.0-uelm.jar
            ae2Sha256: 6c7ce22131cc8500a9deba17a864fe69ad143b5e18b4596ea6e8523469eec198
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Download pinned compatibility artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci/mods
          curl --fail --location --retry 3 \
            --output ".ci/mods/${{ matrix.ae2File }}" \
            "${{ matrix.ae2Url }}"
          curl --fail --location --retry 3 \
            --output .ci/mods/AdvancedAE-1.3.5-1.20.1.jar \
            https://www.cursemaven.com/curse/maven/advancedae-1084104/7939754/advancedae-1084104-7939754.jar
          curl --fail --location --retry 3 \
            --output .ci/mods/ae2omnicells-1.20.1-forge-1.1.6.jar \
            https://www.cursemaven.com/curse/maven/omni-cells-1359517/8050975/omni-cells-1359517-8050975.jar
          curl --fail --location --retry 3 \
            --output .ci/mods/AE2AddonLib-1.0.4-1.20.1.jar \
            https://www.cursemaven.com/curse/maven/ae2addonlib-1366135/7668681/ae2addonlib-1366135-7668681.jar

          cat > .ci/SHA256SUMS <<EOF
          ${{ matrix.ae2Sha256 }}  mods/${{ matrix.ae2File }}
          ee172c27c28b1d545e1501575021d8f0e5b34ca9dc8a901f7544b0a7fedf0262  mods/AdvancedAE-1.3.5-1.20.1.jar
          c3222ad905ddb0a0517bbd76b48722bfe5a2e5770375f1e393b427d4a26fd5e7  mods/ae2omnicells-1.20.1-forge-1.1.6.jar
          47bbd147a155c24aa58944a6b52eec7935cc4135bbf2e68f89208993c7538501  mods/AE2AddonLib-1.0.4-1.20.1.jar
          EOF
          (cd .ci && sha256sum --check SHA256SUMS)

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew clean build --stacktrace \
            -Pae2Variant=${{ matrix.ae2Variant }} \
            -PaqeLocalModsDir=.ci/mods

      - name: Verify 1.20.1 artifact boundary
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
          artifact="build/libs/aqe${version}_1.20.1.jar"
          test -f "$artifact"
          jar tf "$artifact" | grep -q '^META-INF/mods.toml$'
          ! jar tf "$artifact" | grep -q '^META-INF/neoforge.mods.toml$'
          ! jar tf "$artifact" | grep -q 'net/neoforged/'
          ! jar tf "$artifact" | grep -q '1.21.1'
          python3 - "$artifact" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as jar:
              classes = [n for n in jar.namelist() if n.endswith('.class')]
              assert classes, 'artifact contains no class files'
              versions = {int.from_bytes(jar.read(n)[6:8], 'big') for n in classes}
              assert versions == {61}, f'unexpected class versions: {versions}'
          PY

      - name: Upload jar
        uses: actions/upload-artifact@v6
        with:
          name: aqe-1.20.1-${{ matrix.ae2Variant }}-${{ github.sha }}
          path: build/libs/aqe*_1.20.1.jar
          if-no-files-found: error
