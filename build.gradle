plugins {
    id 'net.minecraftforge.gradle' version '6.0.54'
}

group = mod_group
version = mod_version

base {
    archivesName = "aqe${mod_version}_${minecraft_version}"
}

tasks.named('jar') {
    archiveFileName = "aqe${mod_version}_${minecraft_version}.jar"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            mods {
                advanced_quantum_engineering {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run-server')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            args '--nogui'
            mods {
                advanced_quantum_engineering {
                    source sourceSets.main
                }
            }
        }
    }
}

def minecraftInstance = file('../../')
def localModsDir = file(findProperty('aqeLocalModsDir') ?: "${minecraftInstance}/mods")
def ae2Variant = (findProperty('ae2Variant') ?: 'upstream').toString().trim().toLowerCase()
def ae2Versions = [
    upstream: '15.4.10',
    uelm: '15.5.0-uelm'
]
if (!ae2Versions.containsKey(ae2Variant)) {
    throw new GradleException("Unknown ae2Variant '${ae2Variant}'. Use 'upstream' or 'uelm'.")
}
def ae2Version = ae2Versions[ae2Variant]
def ae2JarName = "appliedenergistics2-forge-${ae2Version}.jar"
def localAe2 = new File(localModsDir, ae2JarName)

repositories {
    mavenCentral()
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev/'
        content {
            includeGroup 'appeng'
        }
    }
    maven {
        name = 'ExpandiumReleases'
        url = 'https://repo.expandium.net/releases'
        content {
            includeGroup 'appeng'
        }
    }
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    flatDir {
        dirs localModsDir
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.18'

    def localAdvancedAe = new File(localModsDir, 'AdvancedAE-1.3.5-1.20.1.jar')
    def localOmniCells = new File(localModsDir, 'ae2omnicells-1.20.1-forge-1.1.6.jar')
    def localAddonLib = new File(localModsDir, 'AE2AddonLib-1.0.4-1.20.1.jar')

    if (localAe2.isFile() && localAdvancedAe.isFile()
            && localOmniCells.isFile() && localAddonLib.isFile()) {
        implementation fg.deobf(group: 'local.mods', name: 'appliedenergistics2-forge', version: ae2Version)
        implementation fg.deobf(group: 'local.mods', name: 'AdvancedAE', version: '1.3.5-1.20.1')
        implementation fg.deobf(group: 'local.mods', name: 'ae2omnicells-1.20.1-forge', version: '1.1.6')
        implementation fg.deobf(group: 'local.mods', name: 'AE2AddonLib', version: '1.0.4-1.20.1')
    } else {
        implementation fg.deobf("appeng:appliedenergistics2-forge:${ae2Version}")

        def advancedAeDependency = project.dependencies.create('curse.maven:advancedae-1084104:7939754') {
            transitive = false
        }
        def omniCellsDependency = project.dependencies.create('curse.maven:omni-cells-1359517:8050975') {
            transitive = false
        }
        def addonLibDependency = project.dependencies.create('curse.maven:ae2addonlib-1366135:7668681') {
            transitive = false
        }

        implementation fg.deobf(advancedAeDependency)
        implementation fg.deobf(omniCellsDependency)
        implementation fg.deobf(addonLibDependency)
    }

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    testImplementation platform('org.junit:junit-bom:5.10.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('verifyAe2Profile') {
    doLast {
        logger.lifecycle("AQE AE2 dependency profile: ${ae2Variant} (${ae2Version})")
        logger.lifecycle("AQE local AE2 override: ${localAe2.absolutePath}")
        if (ae2Variant == 'uelm') {
            logger.lifecycle('AE2-UELM is selected as a replacement for mod id ae2; no extra UELM mod id is loaded.')
        }
    }
}

tasks.named('check') {
    dependsOn 'verifyAe2Profile'
}

test {
    useJUnitPlatform()
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand 'file': ['jarVersion': project.version]
    }
}

jar {
    // 配布JAR内のMinecraft参照を、本番環境で使われる難読化名へ必ず変換する。
    finalizedBy 'reobfJar'
    manifest {
        attributes([
            'Specification-Title': mod_id,
            'Specification-Vendor': 'syaru',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'syaru',
            'Implementation-License': 'LGPL-3.0-only',
            'MixinConfigs': 'advanced_quantum_engineering.mixins.json'
        ])
    }
}

tasks.register('normalizeReobfJarName') {
    dependsOn 'reobfJar'
    doLast {
        def expected = file("$buildDir/libs/aqe${mod_version}_${minecraft_version}.jar")
        def sources = fileTree("$buildDir/libs").matching {
            include "aqe${mod_version}_${minecraft_version}-*.jar"
        }.files
        def source = sources.find { it.name != expected.name }
        if (source != null && source.exists()) {
            if (!source.renameTo(expected)) {
                throw new GradleException("Could not normalize ${source.name} to ${expected.name}")
            }
        }
        if (!expected.isFile()) {
            throw new GradleException("Expected distribution JAR was not produced: ${expected}")
        }
    }
}

tasks.named('build') {
    finalizedBy 'normalizeReobfJarName'
}
